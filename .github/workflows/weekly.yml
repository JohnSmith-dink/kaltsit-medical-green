name: Weekly compatibility

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 14:00 Asia/Shanghai; GitHub schedules use UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locked:
    name: Locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check pinned dependencies without updating the lock
        run: nix flake check --no-update-lock-file --print-build-logs

  unstable:
    name: Unstable compatibility probe
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Probe unstable without writing the lock
        run: nix flake check --no-write-lock-file --print-build-logs --override-input nixpkgs github:NixOS/nixpkgs/nixpkgs-unstable
